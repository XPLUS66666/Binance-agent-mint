  rationale: 'Ten active managed skills trigger consolidation, and four of them cover one patrol workflow with overlapping tracking, threshold and closing rules. Agent drop discovery, patrol leg breaks, paid fixed tier tracking and held NFT valuation were read in full and each prescribes the same round record, recheck and single close, differing only by leg or threshold. The 2026-11-02 evidence shows that fragmentation in practice: patrol rounds stayed partial, Harvest phases filled between rounds, and several projects closed in the same round they were first tracked (3481e1ee, 3ebf05d6, 7a26a706e35f, 84027d44). The merged skill preserves all four methods, reconciles the 80 percent progress notice with the 95 percent free escalation and the paid tier alert, adds the small quota and name-only first report exception that 2026-11-02 practice used, and adds two 2026-11-02 mint lessons: a generic simulation block on an unverified contract can be a project side funding shortfall rather than user ineligibility (37bb0a6a), and a mint argument, not only a price field, decides free versus paid (197d4bb7). No other family was merged: time window race versus session recovery, preflight versus state writes, and language gate versus external signature check cover distinct objects.'
